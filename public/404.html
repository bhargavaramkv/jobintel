<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>JobIntel</title>
  </head>
  <body style="background:#05080f;color:#9aabbf;font-family:system-ui,sans-serif">
    <p>Opening JobIntel…</p>
    <script>
      // GitHub Pages serves this page for any path that is not a file. The app uses hash routes,
      // so move /jobintel/<page> to /jobintel/#/<page> and let the app open it.
      (function () {
        var base = '/jobintel/'
        var path = location.pathname
        var rest = path.indexOf(base) === 0 ? path.slice(base.length - 1) : '/'
        location.replace(base + '#' + rest + location.search)
      })()
    </script>
  </body>
</html>
